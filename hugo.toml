baseURL = "https://ly5287.github.io/BQ-home/"
languageCode = 'zh-cn'
title = '87档案室'
theme = 'hugo-theme-relearn'
defaultContentLanguage = "zh"

# 启用搜索功能，Relearn 需要输出 JSON 索引文件[reference:2]
# 定义自定义输出格式（全文本 JSON 索引）
[outputFormats.FulltextJSON]
  name = "FulltextJSON"
  mediaType = "application/json"
  baseName = "fulltext"
  isPlainText = true
  notAlternative = true

# 为首页启用该输出（home 是 Hugo 的首页页面类型）
[outputs]
  home = ["HTML", "RSS", "FulltextJSON"]
  page = ["HTML"]

[menus]
 [[menu.main]]
    name = "搜索"
    url = "/search.html"
    weight = 5
 [[menus.main]]
    identifier = "yuehui"
    name = "约会"
    url = "/约会/"
    weight = 10
  [[menus.main]]
    identifier = "xunxi"
    name = "讯息"
    url = "/讯息/"
    weight = 20
  [[menus.main]]
    identifier = "zhuxian"
    name = "主线"
    url = "/主线/"
    weight = 30
  [[menus.main]]
    identifier = "qita"
    name = "其他"
    url = "/其他/"
    weight = 40
  [[menus.main]]
    identifier = "xianshihuixiang"
    name = "现实回响"
    url = "/现实回响/"
    weight = 50

[markup.goldmark.renderer]
  unsafe = true

[params]
  themeVariant = "blue"
  font = "system-ui, -apple-system, Microsoft YaHei, sans-serif"  # 全局字体（优先系统无衬线，更清爽）
  custom_css = ["css/custom.css"]
  custom_js = ["/js/custom.js"]
  alwaysopen = false
  collapsibleMenu = true
  showVisitedLinks = false
  disableMetaDescription = true
