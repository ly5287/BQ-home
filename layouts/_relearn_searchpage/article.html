<main id="R-body-inner" data-pagefind-body>
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
    </header>
    <div class="post-content">
      <div id="pagefind-search"></div>
      <link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
      <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (typeof PagefindUI === 'undefined') {
      document.getElementById('pagefind-search').innerHTML = '<p style="color:red;">搜索功能加载失败，请刷新页面重试。</p>';
      return;
    }

new PagefindUI({
  element: "#pagefind-search",
  baseUrl: {{ if or (hasPrefix site.BaseURL "https://ly5287.github.io") (eq hugo.Environment "development") }}"/BQ-home/"{{ else }}"/"{{ end }},
  showSubResults: false,
  maxResults: 200,           // ← 添加这一行，默认 20，现在扩大到 200
  processResult: (result) => {
    result.sub_results = [];  // 保持去重

    // 附加搜索词到结果链接（关键恢复）
    const input = document.querySelector('.pagefind-ui__search-input');
    const currentQ = input?.value?.trim();
    if (currentQ && result.url) {
      const url = new URL(result.url, window.location.origin);
      url.searchParams.delete('q');
      url.searchParams.set('q', currentQ);
      result.url = url.pathname + url.search + url.hash;
    }

    // 暂时移除 return null 的过滤逻辑，避免误伤
    // 如果您需要精确过滤，稍后再用 DOM 隐藏方式安全实现

    return result;
  }
});

// 下面的自动填充代码保留不变
const urlParams = new URLSearchParams(window.location.search);
const q = urlParams.get('q');
if (q) {
  setTimeout(() => {
    const input = document.querySelector('.pagefind-ui__search-input');
    if (input) {
      input.value = q;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }, 200);
}
  });
</script>
    </div>
  </article>
</main>
