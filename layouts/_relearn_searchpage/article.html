<main id="R-body-inner" data-pagefind-body>
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
    </header>
    <div class="post-content">

<div class="search-mode-selector">
<div class="mode-card active" data-mode="default">
  <h3>默认模式 <span class="mode-arrow">▾</span></h3>
  <p>全站搜索，包含精准搜索及少量模糊搜索。同一页面包含多处搜索词时仅显示一次</p>
</div>
<div class="mode-card" data-mode="full">
  <h3>完整模式 <span class="mode-arrow">▾</span></h3>
  <p>全站搜索，仅包含精准搜索，同一页面包含多处搜索词时逐一显示</p>
</div>
<div class="mode-card" data-mode="local">
  <h3>局部搜索 <span class="mode-arrow">▾</span></h3>
  <p>在指定栏目中搜索，仅包含精准搜索，同一页面包含多处搜索词时逐一显示</p>
</div>
</div>

      <div id="pagefind-search"></div>

<div id="precise-search-container" style="display:none; border:none; background:transparent; box-shadow:none;">
  <div class="precise-search-box">
 
    <!-- 升级为带分组的多级下拉选择器 -->
    <select id="scope-selector" class="scope-selector" style="display:none;">
      <option value="">栏目选择</option>
      <!-- 一级普通栏目 -->
      <option value="/1.约会/">约会</option>
      <option value="/2.讯息/">讯息</option>
      <!-- 主线分组，包含二级子栏目 -->
      <optgroup label="主线">
        <option value="/3.主线/">主线（全部）</option>
        <option value="/3.主线/第一季/">主线 - 第一季</option>
        <option value="/3.主线/第二季/">主线 - 第二季</option>
        <option value="/3.主线/第三季/">主线 - 第三季</option>
      </optgroup>
      <!-- 其余一级栏目 -->
      <option value="/4.杂篇/">杂篇</option>
      <option value="/5.外编/">外编</option>
      <option value="/6.附录/">附录</option>
    </select>

   <span class="precise-search-icon"></span>
    <input type="text" class="precise-search-input" placeholder="搜索..." autofocus>
    <button class="precise-search-clear" type="button" title="清除搜索">✕</button>
  </div>
  <div class="precise-search-stats"></div>
  <div class="precise-search-results"></div>
</div>

      <link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
      <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (typeof PagefindUI === 'undefined') {
      document.getElementById('pagefind-search').innerHTML = '<p style="color:red;">搜索功能加载失败，请刷新页面重试。</p>';
      return;
    }

const scopeSelector = document.getElementById('scope-selector');
let currentSearchScope = "";
// 监听下拉切换，更新搜索范围
scopeSelector.addEventListener('change', function(){
  currentSearchScope = this.value;
  // 触发一次重新搜索
  const input = document.querySelector('.pagefind-ui__search-input');
  if(input.value.trim()){
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

new PagefindUI({
  element: "#pagefind-search",
  baseUrl: {{ if or (hasPrefix site.BaseURL "https://ly5287.github.io") (eq hugo.Environment "development") }}"/BQ-home/"{{ else }}"/"{{ end }},
  showSubResults: false,
  maxResults: 200,
  processResult: (result) => {
    result.sub_results = [];

    // 附加搜索词到结果链接
    const input = document.querySelector('.pagefind-ui__search-input');
    const currentQ = input?.value?.trim();
    if (currentQ && result.url) {
      const url = new URL(result.url, window.location.origin);
      url.searchParams.delete('q');
      url.searchParams.set('q', currentQ);
      result.url = url.pathname + url.search + url.hash;
    }

    // 局部搜索模式下，过滤不匹配路径的结果
    const activeMode = document.querySelector('.mode-card.active')?.dataset.mode;
    if(activeMode === "local" && currentSearchScope){
      // 路径前缀匹配，只保留选中目录下的页面
      if(!result.url.startsWith(currentSearchScope)){
        return null; // 过滤掉不在当前栏目内的结果
      }
    }

    return result;
  }
});

// 页面URL参数回填搜索词
const urlParams = new URLSearchParams(window.location.search);
const q = urlParams.get('q');
if (q) {
  setTimeout(() => {
    const input = document.querySelector('.pagefind-ui__search-input');
    if (input) {
      input.value = q;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }, 200);
}
  });
</script>
    </div>
  </article>
</main>
